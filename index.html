        let currentCategory = 'all';

            grid.innerHTML = '';
            let count = 0;

            toolsData.forEach(tool => {
                const matchCategory = (currentCategory === 'all' || tool.category === currentCategory);
                const matchSearch = (tool.title.toLowerCase().includes(searchVal) || tool.desc.toLowerCase().includes(searchVal) || tool.category.toLowerCase().includes(searchVal));

                if (matchCategory && matchSearch) {
                    count++;

                    card.className = 'glass-card glass-card-hover rounded-2xl p-5 flex flex-col justify-between space-y-4 border border-white cursor-pointer';

                    if (tool.category === 'Maker') badgeColor = 'bg-pink-100 text-pink-700 border-pink-200';
                    if (tool.category === 'Alight Motion') badgeColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    if (tool.category === 'AI Assistant') badgeColor = 'bg-purple-100 text-purple-700 border-purple-200';
                    if (tool.category === 'Utilitas') badgeColor = 'bg-amber-100 text-amber-700 border-amber-200';

                    card.innerHTML = `

            buttons.forEach(btn => {
                if(btn.innerText.toLowerCase().includes(cat.toLowerCase()) || (cat === 'all' && btn.innerText.toLowerCase().includes('semua'))) {

        let activeTool = null;

        function openToolModal(tool) {
            activeTool = tool;
            document.getElementById('modalTitle').innerText = tool.title;
            document.getElementById('modalBadge').innerText = tool.category;
            document.getElementById('modalDesc').innerText = tool.desc;

            const inputsBox = document.getElementById('modalInputs');
            const outputBox = document.getElementById('modalOutput');
            inputsBox.innerHTML = '';
            outputBox.classList.add('hidden');
            outputBox.innerHTML = '';

            if (tool.isMultiParam) {
                tool.params.forEach(p => {
                    inputsBox.innerHTML += `
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">${p.label}:</label>
                            <input type="${p.type}" id="param_${p.name}" placeholder="${p.placeholder}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-brand-400 focus:outline-none bg-white">

                modalBox.classList.remove('scale-95');

        function closeModal() {

            const modalBox = document.getElementById('modalBox');
            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function executeToolAction() {
            if (!activeTool) return;

            const outputBox = document.getElementById('modalOutput');
            outputBox.classList.remove('hidden');

            if (activeTool.isCustomClientTool) {
                const inputVal = document.getElementById('singleInput') ? document.getElementById('singleInput').value.trim() : '';
                executeLocalTool(activeTool.type, inputVal, outputBox);
                return;
            }

            let finalUrl = activeTool.endpoint;

            if (activeTool.isMultiParam) {
                let missing = false;
                activeTool.params.forEach(p => {
                    const val = document.getElementById(`param_${p.name}`).value.trim();
                    if (!val) missing = true;
                    finalUrl += `&${p.name}=${encodeURIComponent(val)}`;
                });
                if (missing) {
                    showToast('Harap isi semua kolom parameter!', 'fa-circle-exclamation');
                    return;
                }
            } else {
                const inputVal = document.getElementById('singleInput').value.trim();
                if (!inputVal) {
                    showToast('Harap isi input terlebih dahulu!', 'fa-circle-exclamation');
                    return;
                }
                finalUrl += `&${activeTool.paramName || 'text'}=${encodeURIComponent(inputVal)}`;
            }

            outputBox.innerHTML = `
                <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-center gap-3 text-brand-600 text-xs font-medium">
                    <i class="fa-solid fa-spinner animate-spin text-base"></i> Memproses permintaan ke server...
                </div>
            `;

            try {
                const res = await fetch(finalUrl);
                const contentType = res.headers.get("content-type");

                if (!res.ok || (contentType && contentType.includes("text/html"))) {
                    outputBox.innerHTML = `
                        <div class="p-3.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-2xl text-xs space-y-1">
                            <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation"></i> Respon Server Tidak Valid</div>
                            <p class="text-[11px] leading-relaxed">Server API sedang mengalami pemeliharaan temporary. Silakan coba kembali nanti.</p>
                        </div>
                    `;
                    return;
                }

                const data = await res.json();
                renderResultUI(activeTool, data, outputBox);

            } catch (err) {
                outputBox.innerHTML = `
                    <div class="p-3.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-2xl text-xs space-y-1">
                        <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> Gagal Memproses</div>
                        <p class="text-[11px]">Tidak dapat membaca respon dari server. Periksa jaringan Anda.</p>
                    </div>
                `;
            }
        }

        async function executeLocalTool(type, inputVal, outputBox) {
            if (type === 'case') {
                if (!inputVal) return showToast('Masukkan teks terlebih dahulu!', 'fa-circle-exclamation');
                const upper = inputVal.toUpperCase();
                const lower = inputVal.toLowerCase();
                const title = inputVal.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

                outputBox.innerHTML = `
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3 text-xs">
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Huruf Besar (UPPERCASE):</span>
                            <div class="p-2.5 bg-slate-900 text-emerald-400 font-mono rounded-xl flex justify-between items-center">${upper} <button onclick="navigator.clipboard.writeText('${upper}'); showToast('Disalin!', 'fa-copy');" class="text-[10px] bg-slate-800 text-white px-2 py-1 rounded">Copy</button></div>
                        </div>
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Huruf Kecil (lowercase):</span>
                            <div class="p-2.5 bg-slate-900 text-cyan-400 font-mono rounded-xl flex justify-between items-center">${lower} <button onclick="navigator.clipboard.writeText('${lower}'); showToast('Disalin!', 'fa-copy');" class="text-[10px] bg-slate-800 text-white px-2 py-1 rounded">Copy</button></div>
                        </div>
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Format Judul (Title Case):</span>
                            <div class="p-2.5 bg-slate-900 text-amber-400 font-mono rounded-xl flex justify-between items-center">${title} <button onclick="navigator.clipboard.writeText('${title}'); showToast('Disalin!', 'fa-copy');" class="text-[10px] bg-slate-800 text-white px-2 py-1 rounded">Copy</button></div>
                        </div>
                    </div>
                `;
                showToast('Format teks berhasil diubah!', 'fa-check');

            } else if (type === 'counter') {
                if (!inputVal) return showToast('Masukkan kalimat terlebih dahulu!', 'fa-circle-exclamation');
                const words = inputVal.trim() ? inputVal.trim().split(/\s+/).length : 0;
                const chars = inputVal.length;
                const charsNoSpace = inputVal.replace(/\s+/g, '').length;
                const readTime = Math.ceil(words / 200);

                outputBox.innerHTML = `
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl grid grid-cols-2 gap-3 text-center">
                        <div class="p-3 bg-white rounded-xl border border-slate-200"><span class="block text-xl font-bold text-brand-600">${words}</span><span class="text-[11px] text-slate-500 font-medium">Jumlah Kata</span></div>
                        <div class="p-3 bg-white rounded-xl border border-slate-200"><span class="block text-xl font-bold text-emerald-600">${chars}</span><span class="text-[11px] text-slate-500 font-medium">Karakter (Dgn Spasi)</span></div>
                        <div class="p-3 bg-white rounded-xl border border-slate-200"><span class="block text-xl font-bold text-purple-600">${charsNoSpace}</span><span class="text-[11px] text-slate-500 font-medium">Karakter (Tanpa Spasi)</span></div>
                        <div class="p-3 bg-white rounded-xl border border-slate-200"><span class="block text-xl font-bold text-amber-600">~${readTime} mnt</span><span class="text-[11px] text-slate-500 font-medium">Est. Waktu Baca</span></div>
                    </div>
                `;
                showToast('Perhitungan selesai!', 'fa-calculator');

            } else if (type === 'json') {
                if (!inputVal) return showToast('Harap masukkan kode JSON!', 'fa-circle-exclamation');
                try {
                    const parsed = JSON.parse(inputVal);
                    const pretty = JSON.stringify(parsed, null, 4);
                    outputBox.innerHTML = `
                        <div class="p-3.5 bg-slate-900 text-emerald-400 rounded-2xl text-xs font-mono space-y-2">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                <span class="text-white font-bold"><i class="fa-solid fa-circle-check text-emerald-400"></i> JSON Valid</span>
                                <button onclick="navigator.clipboard.writeText(\`${pretty.replace(/\\/g, '\\\\').replace(/`/g, '\\`')}\`); showToast('JSON Disalin!', 'fa-copy');" class="text-[11px] bg-slate-800 text-white px-2.5 py-1 rounded-lg">Copy Format</button>
                            </div>
                            <pre class="overflow-x-auto max-h-60 leading-relaxed">${escapeHtml(pretty)}</pre>
                        </div>
                    `;
                    showToast('Format JSON berhasil diperbaiki!', 'fa-check');
                } catch (e) {
                    outputBox.innerHTML = `
                        <div class="p-3.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-2xl text-xs space-y-1">
                            <div class="font-bold"><i class="fa-solid fa-circle-xmark"></i> JSON Tidak Valid</div>
                            <p class="text-[11px]">Pastikan format string JSON Anda sudah benar.</p>
                        </div>
                    `;
                }

            } else if (type === 'ipcheck') {
                outputBox.innerHTML = `<div class="p-3 text-center text-xs text-slate-500"><i class="fa-solid fa-spinner animate-spin"></i> Memeriksa IP & Jaringan...</div>`;
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    const ua = navigator.userAgent;

                    outputBox.innerHTML = `
                        <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3 text-xs">
                            <div>
                                <span class="font-bold text-slate-700 block mb-1">IP Address Publik Anda:</span>
                                <div class="p-3 bg-slate-900 text-cyan-400 font-mono text-sm rounded-xl font-bold flex justify-between items-center">
                                    <span>${data.ip}</span>
                                    <button onclick="navigator.clipboard.writeText('${data.ip}'); showToast('IP Disalin!', 'fa-copy');" class="text-xs bg-slate-800 text-white px-2.5 py-1 rounded-lg">Copy</button>
                                </div>
                            </div>
                            <div>
                                <span class="font-bold text-slate-700 block mb-1">Info User Agent Browser:</span>
                                <div class="p-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl text-[11px] leading-relaxed break-all">${ua}</div>
                            </div>
                        </div>
                    `;
                    showToast('Info IP ditemukan!', 'fa-network-wired');
                } catch (e) {
                    showToast('Gagal memuat info IP.', 'fa-triangle-exclamation');
                }

            } else if (type === 'calculator') {
                const p = parseFloat(document.getElementById('param_price')?.value);
                const d = parseFloat(document.getElementById('param_discount')?.value);

                if (isNaN(p) || isNaN(d)) return showToast('Harap masukan nominal harga & persen diskon!', 'fa-circle-exclamation');

                const cut = (p * d) / 100;
                const finalP = p - cut;

                const fmt = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(num);

                outputBox.innerHTML = `
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 text-xs">
                        <div class="flex justify-between py-1 border-b border-slate-200">
                            <span class="text-slate-600">Harga Normal:</span>
                            <span class="font-bold text-slate-800">${fmt(p)}</span>
                        </div>
                        <div class="flex justify-between py-1 border-b border-slate-200">
                            <span class="text-rose-600">Hemat Diskon (${d}%):</span>
                            <span class="font-bold text-rose-600">- ${fmt(cut)}</span>
                        </div>
                        <div class="flex justify-between py-2 bg-emerald-100/60 px-3 rounded-xl border border-emerald-200">
                            <span class="font-bold text-emerald-800">Total Pembayaran:</span>
                            <span class="font-extrabold text-emerald-700 text-sm">${fmt(finalP)}</span>
                        </div>
                    </div>
                `;
                showToast('Kalkulasi diskon selesai!', 'fa-tags');

            } else if (type === 'url') {
                if (!inputVal) return showToast('Masukkan URL atau teks!', 'fa-circle-exclamation');
                const enc = encodeURIComponent(inputVal);
                const dec = decodeURIComponent(inputVal);

                outputBox.innerHTML = `
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3 text-xs">
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Hasil Encode URL:</span>
                            <div class="p-2.5 bg-slate-900 text-cyan-400 font-mono rounded-xl break-all">${enc}</div>
                        </div>
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Hasil Decode URL:</span>
                            <div class="p-2.5 bg-slate-900 text-emerald-400 font-mono rounded-xl break-all">${dec}</div>
                        </div>
                    </div>
                `;
                showToast('URL berhasil dikonversi!', 'fa-link');

            } else if (type === 'qr') {
                const val = inputVal || 'https://yanzstoru.com';
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(val)}`;
                outputBox.innerHTML = `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl text-center space-y-3">
                        <span class="font-bold text-xs text-slate-700 block">Kode QR Berhasil Dibuat:</span>
                        <img src="${qrUrl}" class="w-48 h-48 mx-auto rounded-xl shadow-md border border-slate-200">
                        <a href="${qrUrl}" target="_blank" download="qr-yanzstoru.png" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-brand-500 text-white rounded-xl text-xs font-bold">
                            <i class="fa-solid fa-download"></i> Unduh Kode QR
                        </a>
                    </div>
                `;
                showToast('QR Code selesai!', 'fa-qrcode');

            } else if (type === 'enc') {
                if (!inputVal) return showToast('Harap isi teks yang ingin dienkripsi!', 'fa-exclamation-circle');
                const base64Enc = btoa(inputVal);
                const hexEnc = Array.from(inputVal).map(c => c.charCodeAt(0).toString(16)).join('');

                outputBox.innerHTML = `
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3 text-xs">
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Hasil Enkripsi Base64:</span>
                            <div class="p-2.5 bg-slate-900 text-cyan-400 font-mono rounded-xl break-all">${base64Enc}</div>
                        </div>
                        <div>
                            <span class="font-bold text-slate-700 block mb-1">Hasil Enkripsi HEX:</span>
                            <div class="p-2.5 bg-slate-900 text-emerald-400 font-mono rounded-xl break-all">${hexEnc}</div>
                        </div>
                    </div>
                `;
                showToast('Enkripsi selesai!', 'fa-lock');

            } else if (type === 'pass') {
                const len = parseInt(inputVal) || 16;
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+';
                let pass = '';
                for (let i = 0; i < len; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));

                outputBox.innerHTML = `
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 text-xs">
                        <span class="font-bold text-slate-700 block">Password Acak Dihasilkan:</span>
                        <div class="p-3 bg-slate-900 text-emerald-400 font-mono text-sm rounded-xl font-bold break-all flex justify-between items-center">
                            <span>${pass}</span>
                            <button onclick="navigator.clipboard.writeText('${pass}'); showToast('Password disalin!', 'fa-copy');" class="text-xs bg-slate-800 text-white px-2.5 py-1 rounded-lg hover:bg-slate-700">Copy</button>
                        </div>
                    </div>
                `;
                showToast('Password selesai!', 'fa-key');
            }
        }

        function renderResultUI(tool, data, container) {
            let html = `<div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs space-y-3">`;
            
            let imgUrl = findKey(data, ['url', 'image', 'img', 'result']);
            let videoUrl = findKey(data, ['video', 'nowatermark', 'no_watermark', 'download_url', 'play']);

            if (tool.category === 'AI Assistant') {
                let aiReply = findKey(data, ['result', 'response', 'reply', 'message', 'text', 'data']) || (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
                if (typeof aiReply === 'object') aiReply = JSON.stringify(aiReply, null, 2);

                html += `
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-purple-700 flex items-center gap-1.5"><i class="fa-solid fa-robot"></i> Jawaban AI:</span>
                            <button onclick="copyResultText()" class="text-brand-600 font-semibold hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-copy"></i> Salin
                            </button>
                        </div>
                        <div id="rawResultText" class="p-3.5 bg-white border border-purple-100 rounded-2xl text-slate-800 text-xs leading-relaxed max-h-60 overflow-y-auto shadow-xs whitespace-pre-wrap">${escapeHtml(aiReply)}</div>
                    </div>
                `;
            } else if (imgUrl && typeof imgUrl === 'string' && (imgUrl.startsWith('http') || imgUrl.startsWith('data:image'))) {
                html += `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl text-center space-y-3">
                        <span class="font-bold text-xs text-slate-700 block"><i class="fa-solid fa-image text-pink-500"></i> Gambar Berhasil Dibuat:</span>
                        <img src="${imgUrl}" class="w-64 h-64 mx-auto rounded-xl shadow-md border border-slate-200 object-cover">
                        <a href="${imgUrl}" target="_blank" download class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-sm">
                            <i class="fa-solid fa-download"></i> Unduh Gambar
                        </a>
                    </div>
                `;
            } else if (videoUrl && typeof videoUrl === 'string' && videoUrl.startsWith('http')) {
                html += `
                    <div class="space-y-2">
                        <span class="font-bold text-slate-700 block"><i class="fa-solid fa-circle-play text-brand-500"></i> Video Hasil:</span>
                        <video controls src="${videoUrl}" class="w-full rounded-xl max-h-60 bg-black"></video>
                        <a href="${videoUrl}" target="_blank" download class="inline-flex items-center justify-center gap-2 w-full py-2.5 bg-emerald-500 text-white rounded-xl font-bold shadow-sm">
                            <i class="fa-solid fa-download"></i> Download Video HD
                        </a>
                    </div>
                `;
            } else {
                let mainText = findKey(data, ['result', 'response', 'message', 'data']) || JSON.stringify(data, null, 2);
                if (typeof mainText === 'object') mainText = JSON.stringify(mainText, null, 2);

                html += `
                    <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                        <span class="font-bold text-slate-700"><i class="fa-solid fa-square-poll-horizontal text-brand-500"></i> Respon Hasil:</span>
                        <button onclick="copyResultText()" class="text-brand-600 font-semibold hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-copy"></i> Salin
                        </button>
                    </div>
                    <pre id="rawResultText" class="p-3 bg-slate-900 text-slate-100 rounded-xl overflow-x-auto text-[11px] font-mono leading-relaxed whitespace-pre-wrap max-h-60">${escapeHtml(mainText)}</pre>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
            showToast('Berhasil memproses!', 'fa-circle-check');
        }

        function findKey(obj, keys) {
            if (!obj || typeof obj !== 'object') return null;
            for (let k of Object.keys(obj)) {
                if (keys.includes(k.toLowerCase())) return obj[k];
                if (typeof obj[k] === 'object') {
                    let res = findKey(obj[k], keys);
                    if (res) return res;
                }
            }
            return null;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function copyResultText() {
            const txt = document.getElementById('rawResultText')?.innerText;
            if (txt) {
                navigator.clipboard.writeText(txt);
                showToast('Hasil berhasil disalin!', 'fa-copy');
            }
        }

        function showToast(msg, icon = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = `fa-solid ${icon} text-emerald-400 text-base`;

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        window.onload = function() { renderTools(); };
    </script>
</body>
</html>
